[workspace]
members = ["noop_swc"]
resolver = "2"

[workspace.dependencies]
serde = "1.0.217"
serde_json = "1.0.134"
swc_core = { version = "30.1.1" }

[profile.release]
# This profile results in small binary size with acceptable impact on
# performance, but there may well be further optimizations to be had.
strip = "debuginfo"
codegen-units = 1
lto = true
opt-level = "z"