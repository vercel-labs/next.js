nodeLinker: node-modules
enableGlobalCache: false

# Yarn Berry reads registry/auth settings ONLY from .yarnrc.yml (it ignores .npmrc).
# The examples/with-docker Dockerfile never copies this file into the image,
# so the private registry mapping below is lost inside the Docker build.
npmScopes:
  repro:
    npmRegistryServer: "http://host.docker.internal:4873"
    npmAlwaysAuth: false

unsafeHttpWhitelist:
  - host.docker.internal
